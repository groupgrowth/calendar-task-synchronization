services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamlit
    container_name: calendar-ui
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "8598:8598"
    volumes:
      - calendar_sync_data:/app/config_files
    restart: unless-stopped

    # Resource constraints
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 256
    oom_kill_disable: false

    # Keep logs bounded
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    container_name: calendar-scheduler
    environment:
      - TZ=America/Sao_Paulo
      # Every 20 minutes (see note below)
      - SYNC_CRON=*/20 * * * *
    volumes:
      - calendar_sync_data:/app/config_files
    depends_on:
      - ui
    restart: unless-stopped

    # Resource constraints
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  calendar_sync_data:
