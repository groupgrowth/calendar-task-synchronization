services:
  calendar-task-synchronization:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calendar-task-synchronization
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "8598:8598"
    restart: always

    # Resource constraints (compose, non-Swarm)
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 256
    oom_kill_disable: false

    # Keep logs bounded
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Optional: override/ensure healthcheck timing (Dockerfile already defines test)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8598/_stcore/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 45s
