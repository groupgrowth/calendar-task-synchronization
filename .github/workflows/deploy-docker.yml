name: Deploy (SSH + Docker Compose)

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-calendar-task-synchronization
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: git@github-sync:groupgrowth/calendar-task-synchronization.git
          APP_DIR: /opt/apps/calendar-task-synchronization
          BRANCH: prod
          USE_GHCR: "false"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_32GB }}
          username: ${{ secrets.SSH_USER_32GB }}
          key: ${{ secrets.SSH_KEY_32GB }}
          envs: REPO_URL,APP_DIR,BRANCH,USE_GHCR,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            # 0) Ensure Docker & Compose exist
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Please install Docker and docker compose on the server."
              exit 1
            fi

            # 1) Ensure user is in the docker group
            if ! groups | grep -q '\bdocker\b'; then
              echo "User must belong to 'docker' group (sudo usermod -aG docker $USER && newgrp docker)."
              exit 1
            fi

            # Configure SSH for git operations (MUST be before any git command)
            export GIT_SSH_COMMAND="ssh -F ~/.ssh/config -o StrictHostKeyChecking=no"
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            # 2) Prepare folder & clone/update repository
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              chown -R "$USER":"$USER" "$APP_DIR"
              git clone --depth=1 --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --prune origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # 3) (Optional) Log in to GHCR
            if [ "${USE_GHCR}" = "true" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            # 4) Compose deploy
            docker compose pull || true
            docker compose down --remove-orphans
            docker compose up -d --build

            # 5) Optional cleanup
            docker image prune -f

            # 6) Basic health check
            docker compose ps

            echo "Deployment completed."